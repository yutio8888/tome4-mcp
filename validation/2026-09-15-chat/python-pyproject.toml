[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tome-mcp-server"
version = "0.7.0"
description = "Local MCP server for the ToME 1.7.6 MCP Bridge addon"
requires-python = ">=3.11"
dependencies = ["mcp==2.2.0"]
license = "GPL-3.0-or-later"

[project.scripts]
tome-mcp-server = "tome_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]
